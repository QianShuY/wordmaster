name: ABC curated 191 meaning-aware examples QA (one-time)

on:
  push:
    branches: ['feat/moci-web-handoff-20261016']
    paths:
      - '.github/workflows/abc-curated-191-quality-once.yml'

permissions:
  contents: write

jobs:
  editorial_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out protected handoff branch
        uses: actions/checkout@v4
        with:
          ref: feat/moci-web-handoff-20261016
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify 191 authored bilingual pairs and full source identity
        run: |
          set -euo pipefail
          node --test test/abc-curated-109.test.js test/abc-curated-tem-82.test.js
          npm test
          node scripts/audit-model-evidence.js --strict
      - name: Record independently reproducible 26612-row quality snapshot
        run: |
          set -euo pipefail
          node scripts/audit-abc-example-quality.js --save
          node scripts/report-abc-dangerous-examples.js --save
          node - <<'NODE'
          const fs=require('node:fs');
          const q=JSON.parse(fs.readFileSync('docs/model-quality-patches/example-quality-audit-20261018.json'));
          const d=JSON.parse(fs.readFileSync('docs/model-quality-patches/dangerous-example-check.json'));
          if(q.rows!==26612||q.missing_pairs!==0||d.homograph_number_leaks.length!==0||d.metalinguistic.length!==0)
            throw Error('Corrupted bilingual content or known numeric leaks');
          if(q.by_method['offline-context-first-draft']!==2789)
            throw Error('191 quality rewrites did not eliminate their mechanical candidates');
          if(q.by_method['editorial-context-rewrite-needs-review']!==1125)
            throw Error('Editorial review-only drafts miscounted');
          console.log(JSON.stringify({total:q.rows,unreviewed_offline:q.by_method['offline-context-first-draft'],
            editorial_drafts:q.by_method['editorial-context-rewrite-needs-review'],
            flagged_by_rules:q.flagged_unique,crossbook_unverified:q.by_method['crossbook-sense-unverified']},null,2));
          NODE
      - name: Save only audited quality reports
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/model-quality-patches/example-quality-audit-20261018.json
          git add -- docs/model-quality-patches/dangerous-example-check.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ABC): verify quality metrics after 191 natural example rewrites'
          git fetch origin feat/moci-web-handoff-20261016
          git rebase origin/feat/moci-web-handoff-20261016
          git push origin HEAD:feat/moci-web-handoff-20261016
