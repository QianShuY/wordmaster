name: Complete all ABC bilingual first drafts (one-time)

on:
  push:
    branches: ['feat/moci-web-handoff-20261016']
    paths:
      - '.github/workflows/complete-all-abc-drafts-once.yml'

permissions:
  contents: write

jobs:
  complete_abc_drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the handoff branch without touching main
        uses: actions/checkout@v4
        with:
          ref: feat/moci-web-handoff-20261016
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate scripts and preview full one-shot completion
        run: |
          set -euo pipefail
          node --check scripts/complete-abc-all.js
          node --check scripts/abc-offline-draft.js
          node --test test/abc-full-draft-closure.test.js
          node scripts/complete-abc-all.js
      - name: Write every missing proposal and six explicit historic caution examples
        run: node scripts/complete-abc-all.js --apply
      - name: Validate 26612 draft rows and zero missing bilingual pairs
        run: |
          set -euo pipefail
          npm test
          node scripts/audit-model-evidence.js --strict
      - name: Commit only worker result proposals and completion progress
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- docs/model-task-results
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "No new changes to commit."
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              docs/model-task-results/worker-A/progress.json|docs/model-task-results/worker-B/progress.json|docs/model-task-results/worker-C/progress.json|docs/model-task-results/worker-A/*/result.json|docs/model-task-results/worker-B/*/result.json|docs/model-task-results/worker-C/*/result.json)
                ;;
              *)
                echo "Refusing unexpected staged file $file" >&2
                exit 1
                ;;
            esac
          done <<< "$staged"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content(ABC): complete all 26612 source-bound bilingual first drafts"
          git push origin HEAD:feat/moci-web-handoff-20261016
