name: Repair 79 CET4/CET6 meaning-aware examples (one-time)

on:
  push:
    branches: ['feat/moci-web-handoff-20261016']
    paths:
      - '.github/workflows/abc-curated-79-quality-once.yml'

permissions:
  contents: write

jobs:
  curated_79:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/moci-web-handoff-20261016
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preview 79 source identity-locked rewrites
        run: |
          set -euo pipefail
          node --check scripts/apply-abc-curated-79.js
          node --test test/abc-curated-79.test.js
          node scripts/apply-abc-curated-79.js
      - name: Write 79 real-usage bilingual candidate examples
        run: node scripts/apply-abc-curated-79.js --apply
      - name: Full unit, API and source integrity checks
        run: |
          set -euo pipefail
          npm test
          node scripts/audit-model-evidence.js --strict
          node scripts/audit-abc-example-quality.js --save
          node scripts/report-abc-dangerous-examples.js --save
      - name: Commit only 3 result files and 2 read-only audit snapshots
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/model-task-results/worker-A/cet6-003/result.json
          git add -- docs/model-task-results/worker-A/cet4-028/result.json
          git add -- docs/model-task-results/worker-A/cet4-029/result.json
          git add -- docs/model-quality-patches/example-quality-audit-20261018.json
          git add -- docs/model-quality-patches/dangerous-example-check.json
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then exit 0; fi
          while IFS= read -r file; do
            case "$file" in
              docs/model-task-results/worker-A/cet6-003/result.json|docs/model-task-results/worker-A/cet4-028/result.json|docs/model-task-results/worker-A/cet4-029/result.json|docs/model-quality-patches/example-quality-audit-20261018.json|docs/model-quality-patches/dangerous-example-check.json) ;;
              *) echo "Unexpected staged file $file" >&2; exit 1 ;;
            esac
          done <<< "$staged"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(ABC): replace 79 mechanical CET4/CET6 examples with natural bilingual contexts'
          git fetch origin feat/moci-web-handoff-20261016
          git rebase origin/feat/moci-web-handoff-20261016
          git push origin HEAD:feat/moci-web-handoff-20261016
