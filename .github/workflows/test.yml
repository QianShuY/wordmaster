name: WordMaster checks

on:
  pull_request:
  push:
    branches: [main, 'feat/moci-web-handoff-*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit and API tests
        run: npm test
      - name: Check browser script syntax
        run: node --check static/app.js
