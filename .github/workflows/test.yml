name: WordMaster checks

on:
  pull_request:
  push:
    branches: [main, 'feat/moci-web-handoff-*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit and API tests
        run: npm test
      - name: Check browser script syntax
        run: node --check static/app.js
      - name: Inspect model worker proposals without approving content
        run: node scripts/audit-model-evidence.js
      - name: Print safe next-worker continuation queue
        run: node scripts/plan-next-model-review.js

      - name: Prepare every A/B/C candidate and independent-review packet
        run: npm run abc:bulk
      - name: Recover existing ABC bilingual examples without self-approval
        run: npm run abc:reuse
      - name: Search cross-book ABC proposals for alternative example candidates
        run: npm run abc:crossbook
      - name: Upload complete A/B/C work packets
        uses: actions/upload-artifact@v4
        with:
          name: abc-bulk-work-packets
          path: output/refinement/abc-bulk/
          if-no-files-found: error
          retention-days: 14
